name: immich_geotagger
description: Background GPS logger that geotags Immich assets using timestamp interpolation.
publish_to: 'none'
version: 1.0.9+1000009

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  package_info_plus: ^9.0.1
  pub_semver: ^2.2.1
  url_launcher: ^6.3.3
  libre_location: ^0.4.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^10.3.11
  share_plus: ^10.1.4
  intl: ^0.20.2
  flutter_map: ^8.2.2
  flutter_map_maplibre: ^0.0.5
  maplibre: ^0.3.5
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
