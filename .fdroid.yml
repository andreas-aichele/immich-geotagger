Categories:
  - Multimedia
License: MIT
WebSite: https://github.com/andreas-aichele/immich-geotagger
SourceCode: https://github.com/andreas-aichele/immich-geotagger
IssueTracker: https://github.com/andreas-aichele/immich-geotagger/issues

RepoType: git
Repo: https://github.com/andreas-aichele/immich-geotagger.git

Builds:
  - versionName: 1.0.0
    versionCode: 1000000
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.5
    rm:
      - ios
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v.*$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0
CurrentVersionCode: 1000000
