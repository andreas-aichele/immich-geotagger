Categories:
  - Multimedia
License: MIT
WebSite: https://github.com/andreas-aichele/immich-geotagger
SourceCode: https://github.com/andreas-aichele/immich-geotagger
IssueTracker: https://github.com/andreas-aichele/immich-geotagger/issues
Changelog: https://github.com/andreas-aichele/immich-geotagger/releases

RepoType: git
Repo: https://github.com/andreas-aichele/immich-geotagger.git

Builds:
  - versionName: 1.0.0
    versionCode: 1000000
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - git -C $$flutter$$ checkout -f 3.47.5
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

  - versionName: 1.0.1
    versionCode: 1000001
    commit: v1.0.1
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - git -C $flutter$ checkout -f 3.47.5
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $flutter$/bin/flutter config --no-analytics
      - $flutter$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $flutter$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.1
CurrentVersionCode: 1000001
