name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        run: |
          flutter create --platforms=android .
          rm -f test/widget_test.dart

      - name: Configure platform permissions
        run: python3 tool/configure_platforms.py

      - name: Configure Android signing
        run: python3 tool/configure_android_signing.py

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "No Android signing secrets configured."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Signing status
        shell: bash
        run: |
          if [[ -f android/key.properties ]]; then
            echo "Using persistent Android release signing key."
          else
            echo "::warning::Android signing secrets are not configured; using Flutter template debug signing for this test build."
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Derive version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            TAG="v0.0.0-dev"
          fi
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: flutter build apk --release --build-name="${{ steps.version.outputs.name }}" --build-number="${{ github.run_number }}"

      - name: Build AAB
        run: flutter build appbundle --release --build-name="${{ steps.version.outputs.name }}" --build-number="${{ github.run_number }}"

      - name: Prepare Android artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/immich-geotagger-${GITHUB_REF_NAME}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/immich-geotagger-${GITHUB_REF_NAME}-android.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  ios:
    name: Build iOS unsigned
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS runner
        run: |
          flutter create --platforms=ios .
          rm -f test/widget_test.dart

      - name: Configure platform permissions
        run: python3 tool/configure_platforms.py

      - run: flutter pub get

      - name: Derive version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            TAG="v0.0.0-dev"
          fi
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --build-name="${{ steps.version.outputs.name }}" --build-number="${{ github.run_number }}"

      - name: Package unsigned IPA
        shell: bash
        run: |
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/immich-geotagger-${GITHUB_REF_NAME}-ios-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: dist/*

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - android
      - ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
