name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      BUILD_ROOT: /tmp/build
      PUB_CACHE: /tmp/build/.pub-cache
    steps:
      - uses: actions/checkout@v4

      - name: Prepare reproducible build workspace
        shell: bash
        run: |
          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"
          cp -a "$GITHUB_WORKSPACE/." "$BUILD_ROOT/"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_STORE_PASSWORD" ]]; then
            echo "::error::Android release signing secrets are incomplete."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$BUILD_ROOT/android/app/upload-keystore.jks"
          cat > "$BUILD_ROOT/android/key.properties" <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: cd "$BUILD_ROOT" && flutter pub get

      - name: Prepare reproducible Android build
        run: cd "$BUILD_ROOT" && python3 tool/prepare_android_reproducible_build.py

      - name: Analyze
        run: cd "$BUILD_ROOT" && flutter analyze

      - name: Test
        run: cd "$BUILD_ROOT" && flutter test

      - name: Validate release version
        shell: bash
        run: |
          cd "$BUILD_ROOT"
          SOURCE_VERSION="$(sed -n -E 's/^version:[[:space:]]*([^+]+)\+([0-9]+)$/\1/p' pubspec.yaml)"
          SOURCE_CODE="$(sed -n -E 's/^version:[[:space:]]*([^+]+)\+([0-9]+)$/\2/p' pubspec.yaml)"

          if [[ -z "$SOURCE_VERSION" || -z "$SOURCE_CODE" ]]; then
            echo "::error::pubspec.yaml must contain a static version like 1.0.0+1000000."
            exit 1
          fi

          echo "Building version $SOURCE_VERSION ($SOURCE_CODE) from pubspec.yaml."

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v$SOURCE_VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version v$SOURCE_VERSION."
            exit 1
          fi

      - name: Build APKs per ABI
        run: cd "$BUILD_ROOT" && flutter build apk --release --split-per-abi --no-pub

      - name: Verify JNI build-id is disabled
        shell: bash
        run: |
          unzip -p "$BUILD_ROOT/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"             lib/armeabi-v7a/libdartjni.so > /tmp/libdartjni.so
          if readelf -n /tmp/libdartjni.so | grep -q "Build ID"; then
            echo "::error::libdartjni.so still contains a GNU build-id."
            exit 1
          fi

      - name: Build AAB
        run: cd "$BUILD_ROOT" && flutter build appbundle --release --no-pub

      - name: Prepare Android artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp "$BUILD_ROOT/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" "dist/immich-geotagger-${GITHUB_REF_NAME}-android-armeabi-v7a.apk"
          cp "$BUILD_ROOT/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "dist/immich-geotagger-${GITHUB_REF_NAME}-android-arm64-v8a.apk"
          cp "$BUILD_ROOT/build/app/outputs/flutter-apk/app-x86_64-release.apk" "dist/immich-geotagger-${GITHUB_REF_NAME}-android-x86_64.apk"
          cp "$BUILD_ROOT/build/app/outputs/bundle/release/app-release.aab" "dist/immich-geotagger-${GITHUB_REF_NAME}-android.aab"
          (
            cd dist
            sha256sum *.apk *.aab > SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  ios:
    name: Build iOS unsigned
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Generate iOS runner
        run: |
          flutter create --platforms=ios .
          rm -f test/widget_test.dart

      - name: Configure platform permissions
        run: python3 tool/configure_platforms.py

      - run: flutter pub get

      - name: Validate release version
        shell: bash
        run: |
          SOURCE_VERSION="$(sed -n -E 's/^version:[[:space:]]*([^+]+)\+([0-9]+)$/\1/p' pubspec.yaml)"
          SOURCE_CODE="$(sed -n -E 's/^version:[[:space:]]*([^+]+)\+([0-9]+)$/\2/p' pubspec.yaml)"

          if [[ -z "$SOURCE_VERSION" || -z "$SOURCE_CODE" ]]; then
            echo "::error::pubspec.yaml must contain a static version like 1.0.0+1000000."
            exit 1
          fi

          echo "Building version $SOURCE_VERSION ($SOURCE_CODE) from pubspec.yaml."

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v$SOURCE_VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version v$SOURCE_VERSION."
            exit 1
          fi

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/immich-geotagger-${GITHUB_REF_NAME}-ios-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: dist/*

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - android
      - ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
