name: Beta Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android beta
    runs-on: ubuntu-latest
    env:
      BUILD_ROOT: /tmp/build
      PUB_CACHE: /tmp/build/.pub-cache

    steps:
      - uses: actions/checkout@v4

      - name: Prepare build workspace
        shell: bash
        run: |
          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"
          cp -a "$GITHUB_WORKSPACE/." "$BUILD_ROOT/"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_STORE_PASSWORD" ]]; then
            echo "::error::Android signing secrets are incomplete."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$BUILD_ROOT/android/app/upload-keystore.jks"
          cat > "$BUILD_ROOT/android/key.properties" <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: cd "$BUILD_ROOT" && flutter pub get

      - name: Prepare reproducible Android build
        run: cd "$BUILD_ROOT" && python3 tool/prepare_android_reproducible_build.py

      - name: Analyze
        run: cd "$BUILD_ROOT" && flutter analyze

      - name: Test
        run: cd "$BUILD_ROOT" && flutter test

      - name: Prepare beta metadata
        id: beta
        shell: bash
        run: |
          cd "$BUILD_ROOT"

          SOURCE_VERSION="$(sed -n -E 's/^version:[[:space:]]*([^+]+)\+([0-9]+)$/\1/p' pubspec.yaml)"
          SOURCE_CODE="$(sed -n -E 's/^version:[[:space:]]*([^+]+)\+([0-9]+)$/\2/p' pubspec.yaml)"
          SHORT_SHA="${GITHUB_SHA::7}"
          BETA_VERSION="${SOURCE_VERSION}-beta.${GITHUB_RUN_NUMBER}+${SHORT_SHA}"

          if [[ -z "$SOURCE_VERSION" || -z "$SOURCE_CODE" ]]; then
            echo "::error::pubspec.yaml must contain a static version like 1.0.0+1000000."
            exit 1
          fi

          echo "source_version=$SOURCE_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_code=$SOURCE_CODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "beta_version=$BETA_VERSION" >> "$GITHUB_OUTPUT"

          echo "Building beta $BETA_VERSION from commit $GITHUB_SHA."

      - name: Build signed APKs
        shell: bash
        run: |
          cd "$BUILD_ROOT"
          flutter build apk \
            --release \
            --split-per-abi \
            --no-pub \
            --build-name="${{ steps.beta.outputs.beta_version }}" \
            --build-number="${{ steps.beta.outputs.source_code }}"

      - name: Prepare beta artifact
        shell: bash
        run: |
          mkdir -p dist

          APK="$BUILD_ROOT/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          OUT="dist/immich-geotagger-beta-${{ steps.beta.outputs.short_sha }}-android-arm64-v8a.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::Expected ARM64 APK not found at $APK"
            exit 1
          fi

          cp "$APK" "$OUT"

          {
            echo "Immich GeoTagger beta"
            echo "Version: ${{ steps.beta.outputs.beta_version }}"
            echo "Source version: ${{ steps.beta.outputs.source_version }}"
            echo "Version code: ${{ steps.beta.outputs.source_code }}"
            echo "Commit: $GITHUB_SHA"
            echo "Branch/ref: $GITHUB_REF_NAME"
            echo "Workflow run: $GITHUB_RUN_NUMBER"
          } > dist/BUILD-INFO.txt

          (
            cd dist
            sha256sum *.apk > SHA256SUMS
          )

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: immich-geotagger-beta-${{ steps.beta.outputs.short_sha }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
